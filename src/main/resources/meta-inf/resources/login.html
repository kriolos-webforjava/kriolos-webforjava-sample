<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Área Restrita</h2>
    <!-- O action deve ser exatamente j_security_check -->
    <form action="j_security_check" method="POST">
        <div>
            <label>Usuário:</label>
            <input type="text" name="j_username" required />
        </div>
        <div>
            <label>Senha:</label>
            <input type="password" name="j_password" required />
        </div>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
