####################################################
# Define o n\u00edvel m\u00ednimo de log do console para permitir mensagens de debug/trace
quarkus.log.console.level=DEBUG

# Ativa o log para as suas classes
quarkus.log.category."io.github.kriolos".level=DEBUG

quarkus.log.category."io.quarkiverse.webforj".level=DEBUG
quarkus.log.category."io.quarkiverse.webforj".min-level=TRACE

# Ativa o debug profundo para o framework webforJ
quarkus.log.category."com.webforj".level=DEBUG
quarkus.log.category."com.webforj".min-level=TRACE

# Ativa o debug para o motor interno e gerenciador de licen\u00e7as
quarkus.log.category."com.basis".level=DEBUG
quarkus.log.category."com.basis".min-level=TRACE



####################################################
# Liberta o tr\u00e1fego HTTP para o Servlet interceptar sem bloqueios proativos do Quarkus
quarkus.http.auth.proactive=false
# Garante que o Undertow permita requisi\u00e7\u00f5es an\u00f3nimas na raiz do webforJ
quarkus.http.auth.permission.default.policy=permit


# 2. \ud83d\udee0\ufe0f RESOLU\u00c7\u00c3O DO FORBIDDEN: Desativa a valida\u00e7\u00e3o estrita de Origin do WebSocket para o Playwright
%test.quarkus.websocket.dispatch-to-virtual-thread=true
%test.quarkus.http.cors=true
%test.quarkus.http.cors.origins=*



####################################################
# WebforJ
####################################################

# DEV CONFIGURATION
webforj.entry = io.github.kriolos.opos.Application
#webforj.version=@webforj.version@
webforj.debug = true
webforj.devtools.craftforj.enabled=true
webforj.devtools.livereload.enabled=false
webforj.devtools.livereload.static-resources-enabled=false
webforj.devtools.browser.open=false


# Configura\u00e7\u00e3o base
#webforj.servlet-mapping=/*
# M\u00f3dulo de Licen\u00e7a e Seguran\u00e7a (Modo Dev)
